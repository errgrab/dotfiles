# --- core ---
set -g mouse on
set -g mode-keys vi
set -g status-keys vi
set -g base-index 1
set -g renumber-windows on
set -g history-limit 10000
set -s escape-time 0
set -s set-clipboard on

# --- prefix ---
unbind C-b
set -g prefix `
bind ` send-prefix

# --- panes ---
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

bind | split-window -h
bind - split-window -v
bind v split-window -h
bind s split-window -v

bind x kill-pane
bind & kill-window

# --- 42 clipboard (X11) ---
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "xsel -i --clipboard"
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "xsel -i --clipboard"
bind C-v run "xsel -o --clipboard | tmux load-buffer - && tmux paste-buffer"

# --- look ---
set -g status-style "bg=default"
set -g status-left ""
set -g status-right "#S"

# set -g pane-border-lines simple
set -g pane-border-style "fg=brightblack"
set -g pane-active-border-style "fg=magenta"

set -g window-status-format "#[fg=brightblack]-"
set -g window-status-current-format "#{?window_zoomed_flag,#[fg=yellow],#[fg=magenta]}+"
set -g window-status-bell-style "fg=red"
